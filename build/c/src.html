<!-- Welfare Avenue: the volunteer confirm page (wave171, planned as wave169a, 30/09/26). Served for every /c/<token> by a Netlify rewrite
     (_redirects). The confirmation text sends each volunteer their own link; the page reads their spot with
     volunteer_confirm_get (the token is the key: first name, role, date and place, never a phone or anyone else),
     Confirm or I can't make it calls volunteer_confirm_submit, and the Hub's roster and dashboards show it at once.
     After confirming: what to expect in their role, with the role's photo from the Photo library. English and French.
     ?test=1 (the admins' test text) shows everything and saves nothing. Built by build/c/make.py from build/c/src.html.
     wave172 (30/09/26): a serving more than 7 days away shows "You're signed up" (confirming opens 7 days before, when the
     confirmation text comes); each role's own questions (a cook's recipe, a server's donations, a new driver's car, how a
     photographer will share) saved by volunteer_confirm_details; the role's forms and guides (links); Add to calendar
     (Google Calendar or an .ics file) for this serving and the person's other servings; the survey after the serving.
     wave173 (30/09/26): cooks say how their food reaches us: pickup from their address in the pickup areas (the old website's
     list) or drop-off at the serving by noon, and whether they stay to serve.
     wave174 (30/09/26): the role's own times (from the serving's start time; in the calendar entries too); the survey, tailored
     to the role, on this page an hour after the serving starts (volunteer_survey_submit); the itinerary by role from the day
     before (team leaders and drivers, servers and photographers, the Community lead; none for cooks). ?test=1 previews both.
     wave175 (30/09/26): "Save to my account" goes to hub.welfareavenue.com/me?link=<token> (the volunteer account page). -->

main{max-width:560px;margin:-62px auto 0;padding:0 16px 36px;position:relative}

.rule{width:56px;height:4px;border-radius:4px;background:var(--gold);margin:10px 0 16px}
.spot{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 18px;font-size:16px}
.spot dt{color:var(--muted);font-size:14px;padding-top:1px}
.spot dd{margin:0;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:rgba(220,165,39,.22);color:var(--ink)}

.ok{display:flex;gap:14px;align-items:center;margin:0 0 6px}

.call{margin:18px 0 0;font-size:15px}

        if (!S.form.neighbourhood || S.form.neighbourhood === '__other') { S.derr = t('errArea'); paint(); return; }
        if (!String(S.form.address || '').trim()) { S.derr = t('errAddr'); paint(); return; }
        if (String(S.form.postal_code || '').trim() && !/^[A-Za-z]\d[A-Za-z] ?\d[A-Za-z]\d$/.test(String(S.form.postal_code).trim())) { S.derr = t('errPostal'); paint(); return; }
        p.pickup = 'pickup'; p.neighbourhood = S.form.neighbourhood; p.address = S.form.address; p.postal_code = S.form.postal_code || '';
      }
    }
    var apply = function () {
      var x = S.d.details = S.d.details || {};
      if ('recipe_id' in p) x.recipe_id = p.recipe_id;
      if ('donations' in p) x.donations = p.donations;
      if ('vehicle' in p) { x.vehicle = p.vehicle; x.model = p.model; var c = [p.vehicle, p.model].filter(Boolean).join(' '); if (c) x.car_on_file = c; }
      if ('photos_share' in p) x.photos_share = p.photos_share;
      if ('pickup' in p) { x.pickup = p.pickup; if (p.pickup === 'pickup') { x.neighbourhood = p.neighbourhood; x.address = p.address; x.postal_code = p.postal_code; } if ('stay_to_serve' in p) x.stay_to_serve = p.stay_to_serve; }
      S.form = {}; S.saved = true;
    };
    if (S.test) { apply(); paint(); return; }
    S.busy = true; paint();
    rpc('volunteer_confirm_details', { p_token: token(), p: p }).then(function (r) {
      S.busy = false;
      if (r.ok && r.body && r.body.ok) apply();
      else if (r.body && r.body.reason === 'past') S.d.past = true;
      else if (r.body && r.body.reason === 'area') S.derr = t('errArea');
      else if (r.body && r.body.reason === 'address') S.derr = t('errAddr');
      else if (r.body && r.body.reason === 'postal') S.derr = t('errPostal');
      else S.err = t('offline');
      paint();
    }).catch(function () { S.busy = false; S.err = t('offline'); paint(); });
  }
  app.addEventListener('click', function (e) {
    var ic = e.target && e.target.closest ? e.target.closest('[data-ics]') : null;
    if (ic) {
      e.preventDefault(); var tk = ic.getAttribute('data-ics');
      var o = tk === token() ? S.d : (S.d.events || []).filter(function (x) { return x.token === tk; })[0];
      if (o) ics(o, tk); return;
    }
    var b = e.target && e.target.closest ? e.target.closest('button') : null; if (!b) return;
    if (b.id === 'yes') answer('yes'); else if (b.id === 'cant') answer('no'); else if (b.id === 'save') save();
    else if (b.id === 'svsend') svSend(); else if (b.id === 'svedit') { S.svEdit = true; paint(); svScroll(); }
  });
  app.addEventListener('change', function (e) {
    var el = e.target; if (!el) return;
    if (el.name === 'dish' || el.name === 'food' || el.name === 'stay' || el.id === 'area') { S.form = Object.assign({}, S.form, readForm()); if (el.name === 'food') S.form.pickup = el.value; if (el.id === 'area') S.form.neighbourhood = el.value; S.saved = false; paint(); }
  });
  document.getElementById('langs').addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button[data-l]') : null; if (!b) return;
    if (S.d) { S.form = Object.assign({}, S.form, readForm()); if (document.getElementById('svsend')) S.sv = Object.assign({}, S.sv || {}, svRead()); }
    S.lang = b.getAttribute('data-l'); S.chosen = true; try { localStorage.setItem('wa_lang', S.lang); } catch (x) { /* fine */ }
    if (S.d) paint(); else langButtons();
  });
  function notFound(msg) {
    document.getElementById('ey').textContent = 'Welfare Avenue';
    app.innerHTML = '<h2>' + E(msg || t('nf')) + '</h2><div class="rule"></div><p>' + E(t('nfh')) + '<a href="sms:' + OPS_TEL + '">' + OPS + '</a>.</p>';
    footer(); langButtons();
  }
  try { var saved = localStorage.getItem('wa_lang'); if (saved === 'fr' || saved === 'en') { S.lang = saved; S.chosen = true; } } catch (e) { /* fine */ }
  if (!S.chosen && q.get('lang') === 'fr') S.lang = 'fr';
  if (!S.chosen && !q.get('lang') && /^fr\b/i.test(navigator.language || '')) S.lang = 'fr';
  langButtons();
  var tk = token();
  if (!tk) { notFound(); return; }
  rpc('volunteer_confirm_get', S.test ? { p_token: tk, p_preview: true } : { p_token: tk }).then(function (r) {
    if (!r.ok) { notFound(t('offline')); return; }
    if (!r.body) { notFound(); return; }
    S.d = r.body;
    if (!S.chosen && r.body.lang === 'fr') S.lang = 'fr';
    setBand(r.body.photo);
    paint();
    if (location.hash === '#survey') svScroll();
  }).catch(function () { notFound(t('offline')); });
})();
</script>
