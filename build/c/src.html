<!-- Welfare Avenue: the volunteer confirm page (wave171, planned as wave169a, 30/09/26). Served for every /c/<token> by a Netlify rewrite
     (_redirects). The confirmation text sends each volunteer their own link; the page reads their spot with
     volunteer_confirm_get (the token is the key: first name, role, date and place, never a phone or anyone else),
     Confirm or I can't make it calls volunteer_confirm_submit, and the Hub's roster and dashboards show it at once.
     After confirming: what to expect in their role, with the role's photo from the Photo library. English and French.
     ?test=1 (the admins' test text) shows everything and saves nothing. Built by build/c/make.py from build/c/src.html.
     wave172 (30/09/26): a serving more than 7 days away shows "You're signed up" (confirming opens 7 days before, when the
     confirmation text comes); each role's own questions (a cook's recipe, a server's donations, a new driver's car, how a
     photographer will share) saved by volunteer_confirm_details; the role's forms and guides (links); Add to calendar
     (Google Calendar or an .ics file) for this serving and the person's other servings; the survey after the serving.
     wave173 (30/09/26): cooks say how their food reaches us: pickup from their address in the pickup areas (the old website's
     list) or drop-off at the serving by noon, and whether they stay to serve. -->
<style>
:root{--green:#103F39;--cream:#FFFAF2;--gold:#DCA527;--ink:#1F201E;--muted:#6B6A66;--line:rgba(16,63,57,.16);--flag:#B3402F;--card:#FFFFFF;--purple:#6F64AB}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.5}
.band{position:relative;background:var(--green) center/cover no-repeat;color:var(--cream);padding:18px 16px 92px;min-height:300px;display:flex;flex-direction:column;overflow:hidden}
.band:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,63,57,.5) 0%,rgba(16,63,57,.6) 40%,rgba(16,63,57,.95) 100%)}
.band.ph{background-image:none!important}
.band > *{position:relative}
.band .in{width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.band .hx{width:100%;max-width:560px;margin:auto auto 0;padding-top:30px}
.band .ey{font-size:12.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.band h1{color:var(--cream);font-size:42px;margin:0;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.band .star{width:52px;height:auto;transform:rotate(12deg);opacity:.95}
.lockup{height:52px;width:auto;display:block;color:var(--cream)}
.langs{display:flex;gap:6px;align-items:center}
.langs button{background:transparent;border:1px solid rgba(255,250,242,.5);color:var(--cream);border-radius:999px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer;min-width:0;margin:0}
.langs button.on{background:var(--cream);color:var(--green);border-color:var(--cream)}
main{max-width:560px;margin:-62px auto 0;padding:0 16px 36px;position:relative}
@media (max-width:480px){.band{min-height:250px;padding-bottom:80px}.band h1{font-size:34px}.lockup{height:44px}.band .star{width:40px}}
.card{background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(16,63,57,.06),0 12px 32px rgba(16,63,57,.08);padding:24px 20px}
@media (min-width:560px){.card{padding:32px 34px}}
h1,h2{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;line-height:1.05;letter-spacing:.2px;text-transform:uppercase;color:var(--green);margin:0 0 6px}
h2{font-size:30px}
h3{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.3px;color:var(--green);margin:22px 0 8px}
.rule{width:56px;height:4px;border-radius:4px;background:var(--gold);margin:10px 0 16px}
.spot{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 18px;font-size:16px}
.spot dt{color:var(--muted);font-size:14px;padding-top:1px}
.spot dd{margin:0;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:rgba(220,165,39,.22);color:var(--ink)}
button{font:inherit;font-weight:600;font-size:18px;border:0;border-radius:999px;padding:15px 28px;background:var(--gold);color:var(--ink);cursor:pointer;width:100%;margin-top:6px}
button:hover{filter:brightness(1.04)}
button:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:3px}
button[disabled]{opacity:.6;cursor:progress}
.no{display:block;text-align:center;margin:14px 0 0;color:var(--green);font-size:15px;background:none;border:0;padding:6px;width:100%;font-weight:500;text-decoration:underline;cursor:pointer}
.banner{border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:15px}
.banner.warn{background:rgba(179,64,47,.08);color:#7e2b1f}
.banner.info{background:rgba(220,165,39,.18)}
.ok{display:flex;gap:14px;align-items:center;margin:0 0 6px}
.ok .tick{flex:none;width:52px;height:52px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.ok .tick svg{width:28px;height:28px}
.ok p{margin:0;color:var(--muted);font-size:14px}
.photo{margin:18px -20px 0;height:210px;background:var(--green) center/cover no-repeat;position:relative}
@media (min-width:560px){.photo{margin:20px -34px 0;height:240px}}
.photo .cap{position:absolute;left:14px;bottom:10px;background:rgba(16,63,57,.85);color:var(--cream);border-radius:999px;padding:3px 12px;font-size:13px}
ul.steps{list-style:none;padding:0;margin:0}
ul.steps li{position:relative;padding:8px 0 8px 34px;border-top:1px solid var(--line)}
ul.steps li:first-child{border-top:0}
ul.steps li:before{content:attr(data-n);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:rgba(220,165,39,.28);color:var(--green);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.kv{margin:10px 0 0;padding:12px 14px;background:rgba(16,63,57,.05);border-radius:12px}
.kv b{display:block;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.call{margin:18px 0 0;font-size:15px}
.call a,.nw{white-space:nowrap}
.done-e{display:block;width:92px;height:auto;margin:0 0 6px}
.heart{position:absolute;right:14px;top:-18px;width:62px;height:auto;transform:rotate(10deg)}
.brandline{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:18px;letter-spacing:.6px;text-transform:uppercase;color:var(--green);margin:22px 0 0}
.sec{margin:22px 0 0;border-top:1px solid var(--line);padding-top:4px}
.q{margin:10px 0 0}
.q label.l{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.q select,.q input[type=text],.q textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.q textarea{min-height:80px;resize:vertical}
.q select:focus,.q input:focus,.q textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(220,165,39,.35)}
.opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;cursor:pointer;font-size:15px}
.opt input{width:18px;height:18px;accent-color:var(--green);flex:none;margin:0}
.opt:has(input:checked){border-color:var(--green);background:rgba(16,63,57,.04)}
.opt small{color:var(--muted);margin-left:auto;font-size:12.5px;white-space:nowrap}
button.sec2{background:var(--green);color:var(--cream);font-size:16px;padding:12px 22px}
.saved{color:#1c6b5d;font-weight:600;font-size:14px;margin:8px 0 0}
.links a.lk{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin:0 0 8px;text-decoration:none;color:var(--green);font-weight:600;font-size:15px}
.links a.lk:after{content:"\2197";font-weight:700;color:var(--gold)}
.links .w{font:700 11.5px 'Space Grotesk',Arial,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.cal{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.cal a,.cal button{flex:1 1 150px;text-align:center;border:1.5px solid var(--green);color:var(--green);background:transparent;border-radius:999px;padding:10px 14px;font:600 14.5px 'Space Grotesk',Arial,sans-serif;text-decoration:none;cursor:pointer;margin:0;width:auto}
.evs{list-style:none;padding:0;margin:6px 0 0}
.evs li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.evs li:first-child{border-top:0}
.evs .d{flex:1 1 180px;min-width:0}
.evs .d b{display:block;font-size:15px}
.evs .d span{color:var(--muted);font-size:13px}
.evs .st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:rgba(220,165,39,.22)}
.evs .st.ok{background:rgba(42,140,122,.16);color:#1c6b5d}
.evs .st.no{background:rgba(179,64,47,.1);color:var(--flag)}
.evs .acts{display:flex;gap:10px;font-size:13.5px}
.soon{display:flex;gap:12px;align-items:flex-start;background:rgba(220,165,39,.16);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:15px}
.soon b{display:block}
.loading{color:var(--muted)}
footer{max-width:560px;margin:0 auto;padding:0 16px 36px;font-size:13px;color:var(--muted)}
a{color:var(--green)}
</style>
</head>

  var S = { d: null, lang: 'en', busy: false, err: '', test: q.get('test') === '1', chosen: false, saved: false, form: {} };
  function t(k) { return (TX[S.lang] || TX.en)[k] || TX.en[k] || k; }
