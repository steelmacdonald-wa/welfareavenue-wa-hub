<!-- Welfare Avenue: the volunteer confirm page (wave171, planned as wave169a, 30/09/26). Served for every /c/<token> by a Netlify rewrite
     (_redirects). The confirmation text sends each volunteer their own link; the page reads their spot with
     volunteer_confirm_get (the token is the key: first name, role, date and place, never a phone or anyone else),
     Confirm or I can't make it calls volunteer_confirm_submit, and the Hub's roster and dashboards show it at once.
     After confirming: what to expect in their role, with the role's photo from the Photo library. English and French.
     ?test=1 (the admins' test text) shows everything and saves nothing. Built by build/c/make.py from build/c/src.html.
     wave172 (30/09/26): a serving more than 7 days away shows "You're signed up" (confirming opens 7 days before, when the
     confirmation text comes); each role's own questions (a cook's recipe, a server's donations, a new driver's car, how a
     photographer will share) saved by volunteer_confirm_details; the role's forms and guides (links); Add to calendar
     (Google Calendar or an .ics file) for this serving and the person's other servings; the survey after the serving.
     wave173 (30/09/26): cooks say how their food reaches us: pickup from their address in the pickup areas (the old website's
     list) or drop-off at the serving by noon, and whether they stay to serve.
     wave174 (30/09/26): the role's own times (from the serving's start time; in the calendar entries too); the survey, tailored
     to the role, on this page an hour after the serving starts (volunteer_survey_submit); the itinerary by role from the day
     before (team leaders and drivers, servers and photographers, the Community lead; none for cooks). ?test=1 previews both.
     wave175 (30/09/26): "Save to my account"; since 11/10/26 (website accounts on) it goes to welfareavenue.com/account/?link=<token> (or /fr/compte/). -->

.wx .ic{font-size:26px;line-height:1}
.wx b{color:#FFFAF2}
.ifoot{position:relative;min-height:230px;background:#103F39 center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 20px;margin-top:6px}
.ifoot:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,32,30,.95) 0%,rgba(31,32,30,.25) 45%,rgba(16,63,57,.85) 100%)}
.ifoot>*{position:relative}
.ifoot h2{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;margin:0;color:#FFFAF2}
.ifoot p{margin:6px 0 0;font-size:14px;color:rgba(255,250,242,.88)}
.ifoot .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.ifoot .row a,.ifoot .row button{color:#FFFAF2;font:600 14px 'Space Grotesk',Arial,sans-serif;background:none;border:0;padding:0;margin:0;width:auto;text-decoration:underline;cursor:pointer}
.ibanner{background:#DCA527;color:#1F201E;border-radius:14px;padding:10px 14px;margin:12px 0;font-size:14.5px;font-weight:600}
/* wave191m: the worked-out run: each stop's time, the drive between stops, the whole route in Google Maps */
ol.route .at{display:inline-flex;align-items:center;gap:5px;font:700 13.5px 'Space Grotesk',Arial,sans-serif;color:#F0C860;margin:5px 0 2px}
ol.route .at svg{width:14px;height:14px}
ol.route .dv{display:block;font-size:12.5px;color:rgba(255,250,242,.55);margin:0 0 2px;font-style:italic}
ol.route .pin + .dv + .at,ol.route .pin + .at{margin-top:5px}
.rsum{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.8fr) minmax(0,1.1fr);gap:8px;margin:2px 0 12px}
.rsum div{background:#1F201E;border-radius:14px;padding:10px 11px;min-width:0}
.rsum b{display:block;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:26px;line-height:1;color:#FFFAF2;white-space:nowrap}
.rsum span{display:block;font-size:12.5px;color:rgba(255,250,242,.66);margin-top:4px;line-height:1.3}
a.rbig{display:flex;align-items:center;justify-content:center;gap:9px;border-radius:16px;padding:14px 16px;background:#DCA527;color:#1F201E;text-decoration:none;font:700 16px 'Space Grotesk',Arial,sans-serif;margin:12px 0 6px;text-align:center}
a.rbig.ghost{background:transparent;color:#FFFAF2;border:1.5px solid rgba(255,250,242,.3);font-size:15px;padding:12px 14px}
a.rbig svg{width:20px;height:20px;flex:none}
@media (max-width:440px){.rsum b{font-size:22px}.rsum div{padding:9px 9px}}
.isec p.rnote{font-size:13.5px;color:rgba(255,250,242,.62);margin:0 0 10px}
/* wave191n: the team leader's storage check after the serving */
.inv .w{font:700 11.5px 'Space Grotesk',Arial,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.inv .ivl{border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.inv .ivr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px 9px 12px;border-top:1px solid var(--line);background:#fff}
.inv .ivr:first-child{border-top:0}
.inv .ivr.low{background:#FFF8E8}
.inv .ivr.missing{background:#FFF1EE}
.inv .ivr .nm{font-size:14.5px;font-weight:600;min-width:0;line-height:1.3}
.inv .ivr .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.inv .seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;flex:none;background:#fff}
.inv .seg button{margin:0;width:auto;border:0;border-radius:0;background:transparent;color:var(--green);font:600 12.5px 'Space Grotesk',Arial,sans-serif;padding:8px 11px;cursor:pointer;white-space:nowrap}
.inv .seg button+button{border-left:1.5px solid var(--line)}
.inv .seg button.on[data-st=ok]{background:var(--green);color:var(--cream)}
.inv .seg button.on[data-st=low]{background:var(--gold);color:var(--ink)}
.inv .seg button.on[data-st=missing]{background:var(--flag);color:var(--cream)}
.inv textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;min-height:80px;resize:vertical}
.inv .lb{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
.inv .sum{margin:6px 0 0;font-size:14.5px}
.inv .sum b{color:var(--flag)}
@media (max-width:460px){.inv .ivr{flex-direction:column;align-items:stretch;gap:7px}.inv .seg{display:flex}.inv .seg button{flex:1;padding:9px 6px}}
.pjopen{display:block;text-decoration:none}
.ichk{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;width:auto;font:700 14.5px 'Space Grotesk',Arial,sans-serif;padding:10px 16px;border-radius:999px;background:#DCA527;color:#1F201E;border:0;cursor:pointer}
.iteaser{display:flex;gap:14px;align-items:center;background:#1F201E;color:#FFFAF2;border-radius:18px;padding:12px;margin:0 0 18px;text-decoration:none;cursor:pointer;border:0;width:100%;text-align:left;font:inherit}
.iteaser .th{width:84px;height:84px;border-radius:14px;background:#103F39 center/cover no-repeat;flex:none}
.iteaser b{display:block;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:24px;text-transform:uppercase;line-height:1;color:#FFFAF2}
.iteaser span{display:block;font-size:13.5px;color:rgba(255,250,242,.78);margin-top:4px}
.iteaser i{margin-left:auto;font-style:normal;background:#DCA527;color:#1F201E;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap}
@media print{
  body.itv,#itv{background:#1F201E!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #itv{margin:0;border-radius:0;box-shadow:none;max-width:none}
  .acts,.ifoot .row,.ih .langs{display:none!important}
  .ih{min-height:300px}
}
</style>

  function pjPaint() {
    var x = S.pj; if (!x) return;
    langButtons(); footer();
    document.getElementById('ey').textContent = t('pjEy'); document.getElementById('ht').textContent = x.partner || '';
    var f = S.pjf || {};
    var head = '<h2>' + E(t('pjT').replace('{p}', x.partner || '')) + '</h2><div class="rule"></div><p style="margin:0 0 6px;font-weight:600">' + E(t('pjSub').replace('{d}', day(x.event_date)).replace('{t}', hm(x.start))) + (x.location ? ' · ' + E(x.location) : '') + '</p>';
    if (S.pjDone) {
      app.innerHTML = head + '<div class="ok">' + tick() + '<div><h2 style="margin:0">' + E(t('pjOk')) + '</h2><p>' + E(S.pjDone.already ? t('pjAlready') : t('pjOkP')) + '</p></div></div>'
        + (S.pjDone.token ? '<a class="pjopen" href="/c/' + E(S.pjDone.token) + '"><button type="button">' + E(t('pjOpen')) + '</button></a>' : '') + callHtml();
      return;
    }
    if (!x.open) { app.innerHTML = head + '<div class="banner info">' + E(t('pjClosed')) + '</div>' + callHtml(); return; }
    var roles = x.roles || [];
    var h = head + '<p style="margin:0 0 12px">' + E(t('pjP')) + '</p>' + (x.joined ? '<p class="m" style="margin:0 0 10px">' + E(t('pjJoined').replace('{n}', x.joined)) + '</p>' : '')
      + '<div class="q"><label class="l" for="pjfirst">' + E(t('pjFirst')) + ' <span class="req">*</span></label><input type="text" id="pjfirst" autocomplete="given-name" maxlength="60" value="' + E(f.first || '') + '"></div>'
      + '<div class="q"><label class="l" for="pjlast">' + E(t('pjLast')) + '</label><input type="text" id="pjlast" autocomplete="family-name" maxlength="60" value="' + E(f.last || '') + '"></div>'
      + '<p class="help" style="margin:12px 0 0;color:var(--muted);font-size:13.5px">' + E(t('pjOne')) + '</p>'
      + '<div class="q"><label class="l" for="pjemail">' + E(t('pjEmail')) + '</label><input type="text" id="pjemail" inputmode="email" autocomplete="email" maxlength="120" value="' + E(f.email || '') + '"></div>'
      + '<div class="q"><label class="l" for="pjphone">' + E(t('pjPhone')) + '</label><input type="text" id="pjphone" inputmode="tel" autocomplete="tel" maxlength="20" value="' + E(f.phone || '') + '"></div>'
      + (roles.length > 1 ? '<div class="q"><label class="l">' + E(t('pjRole')) + '</label>' + roles.map(function (r, i) { var on = f.role ? f.role === r.role : i === 0; return '<label class="opt"><input type="radio" name="pjrole" value="' + E(r.role) + '"' + (on ? ' checked' : '') + '><span>' + E((S.lang === 'fr' ? r.fr : r.en) || r.role) + '</span></label>'; }).join('') + '</div>' : '')
      + (S.pjErr ? '<div class="banner warn" style="margin:12px 0 0" role="alert">' + E(S.pjErr) + '</div>' : '')
      + '<button type="button" id="pjsend"' + (S.busy ? ' disabled' : '') + '>' + E(S.busy ? t('saving') : t('pjSend')) + '</button>'
      + '<p class="m" style="margin:12px 0 0">' + E(t('pjPriv')) + '</p>' + callHtml();
    app.innerHTML = h;
  }
  function pjRead() {
    var v = function (id) { var el = document.getElementById(id); return el ? el.value : undefined; };
    var r = document.querySelector('input[name="pjrole"]:checked');
    var f = { first: v('pjfirst'), last: v('pjlast'), email: v('pjemail'), phone: v('pjphone') };
    if (r) f.role = r.value; else if ((S.pj.roles || []).length === 1) f.role = S.pj.roles[0].role;
    return f;
  }
  function pjSend() {
    if (S.busy) return;
    var f = S.pjf = Object.assign({}, S.pjf || {}, pjRead()); S.pjErr = '';
    var digits = String(f.phone || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
    if (!String(f.first || '').trim()) S.pjErr = t('pjErrName');
    else if (!String(f.email || '').trim() && !digits) S.pjErr = t('pjErrContact');
    else if (String(f.email || '').trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(f.email).trim())) S.pjErr = t('pjErrEmail');
    else if (digits && digits.length !== 10) S.pjErr = t('pjErrPhone');
    if (S.pjErr) { pjPaint(); return; }
    if (S.test) { S.pjDone = { token: '', already: false }; pjPaint(); return; }
    S.busy = true; pjPaint();
    rpc('volunteer_partner_join', { p_token: token(), p: { first: f.first, last: f.last || '', email: f.email || '', phone: digits, role: f.role || '', lang: S.lang } }).then(function (r) {
      S.busy = false;
      var b = r.body || {};
      if (r.ok && b.ok) { S.pjDone = { token: b.token, already: !!b.already }; }
      else if (b.reason === 'closed' || b.reason === 'full') { S.pj.open = false; }
      else S.pjErr = b.reason === 'email' ? t('pjErrEmail') : b.reason === 'phone' ? t('pjErrPhone') : b.reason === 'contact' ? t('pjErrContact') : b.reason === 'name' ? t('pjErrName') : t('offline');
      pjPaint();
    }).catch(function () { S.busy = false; S.pjErr = t('offline'); pjPaint(); });
  }
  function tryPartner(tk) {
    rpc('volunteer_partner_get', { p_token: tk }).then(function (r) {
      if (!r.ok || !r.body) { notFound(); return; }
      S.pj = r.body; pjPaint();
    }).catch(function () { notFound(t('offline')); });
  }
  function notFound(msg) {
    document.getElementById('ey').textContent = 'Welfare Avenue';
    app.innerHTML = '<h2>' + E(msg || t('nf')) + '</h2><div class="rule"></div><p>' + E(t('nfh')) + '<a href="sms:' + OPS_TEL + '">' + OPS + '</a>.</p>';
    footer(); langButtons();
  }
  try { var saved = localStorage.getItem('wa_lang'); if (saved === 'fr' || saved === 'en') { S.lang = saved; S.chosen = true; } } catch (e) { /* fine */ }
  if (!S.chosen && q.get('lang') === 'fr') S.lang = 'fr';
  if (!S.chosen && !q.get('lang') && /^fr\b/i.test(navigator.language || '')) S.lang = 'fr';
  langButtons();
  var tk = token();
  if (!tk) { notFound(); return; }
  rpc('volunteer_confirm_get', S.test ? { p_token: tk, p_preview: true } : { p_token: tk }).then(function (r) {
    if (!r.ok) { notFound(t('offline')); return; }
    if (!r.body) { tryPartner(tk); return; }
    S.d = r.body;
    if (!S.chosen && r.body.lang === 'fr') S.lang = 'fr';
    setBand(r.body.photo);
    paint();
    if (location.hash === '#survey') svScroll();
    invLoad();
  }).catch(function () { notFound(t('offline')); });
})();
  /* wave232 (Steel, 12/10/26): the French logo, Avenue du Bien-Etre, on French pages; the English lockup otherwise */
  function waLogoLang(fr) {
    var svg = document.querySelector('svg.lockup'); if (!svg) return;
    var img = svg.parentNode.querySelector('img.lockup');
    if (fr && !img) { img = document.createElement('img'); img.className = 'lockup'; img.alt = 'Avenue du Bien-Être'; img.src = 'https://zwnmulmnvopclzcvytce.supabase.co/storage/v1/object/public/content-images/brand/logo-fr-lockup-cream-1200.png'; svg.parentNode.insertBefore(img, svg); }
    if (img) img.style.display = fr ? '' : 'none';
    svg.style.display = fr ? 'none' : '';
  }
</script>
