<title>Welfare Avenue: your offer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Welfare Avenue: the onboarding link page (01/11/26, wave271). Served for every /o/<token> by a Netlify rewrite (_redirects),
     deployed by host-sync from site_files path o/index.html. A new hire opens their personal link from the offer email, answers
     Accept or Decline, then marks the times they can meet in a grid; the new manager gets the same grid for the 1-on-1. The page
     asks the onboard-link function who the token is for (first name and role only) and what to show. Nothing is saved on open:
     ?a=accept or ?a=decline (the email buttons) only highlight that button (Accept also takes the focus; Decline never does, so a
     stray Enter cannot decline), and the person still presses it, so a mail scanner that opens the link answers nothing. If the
     server cannot be reached the page says so and offers to try again; it only says a link does not work when the function says so. The new hire's grid needs grid.minHours hours (the function's onboard_grid_min_hours, 10 by default) before Save is enabled: the counter reads "N of M hours marked" and one plain sentence says why Save waits; the manager's grid has no minimum. English and French (?l=fr, else the function's lang). Grid times come from the instants
     the function sends, formatted with Intl in America/Toronto, never by adding offsets. The password view is a stub until Task 10.
     wave275 (Task 2, 02/11/26; amended in Task 6 the same day, Steel: the week is wave276's typical week): a manager link in mode propose shows the
     manager's own page instead of the 1-on-1 grid: first, when no week is saved on Home or their team asked again since, "Set your week on the
     Hub's Home page" with a link to hub.welfareavenue.com (wave276's pop-up opens there); then their usual week, read-only, as the function derives
     it; then their one-off dates (Add a date, Remove this date; no blocks means not available that day), saved with Save these dates (only the dates
     are posted); then the two picks, "Onboarding call (60 min)" and "1-on-1 (30 min)", each a click on a cell of the
     next 14 days. A cell that cannot start the meeting being picked (outside the saved hours, under the lead time, over a hub@ meeting or another
     new hire's times, or over the other pick) is greyed and disabled, with a legend; onboard-run checks again when "Propose these times" is pressed,
     and its refusal shows in the page's language. A wave271 flow (mode grid, or no mode) keeps the grid as it was.
     wave275 (Task 3, 02/11/26), the hire's link. An offer with hours a week shows "I confirm I can give at least N hours a week to Welfare Avenue",
     which must be ticked before Accept (sent as hours_ok); an offer from before wave275 has no hours line. After Accept, in mode propose: the two
     proposed times with the manager (each as a span, Toronto time through Intl), "Yes, both work" and "No, suggest other times", each one POST
     behind a button. Yes: the closing page ("Thank you, <name>. Your invites are on their way; <manager> will see you on <date>.") with the link
     to the setup rundown. Yes on times that have moved (stale): the function's sentence, then the grid. No: with availability asked, the grid
     with the hire's minimum hours, whose Save shows the closing page ("<manager> will pick from your times"), with Change my times; with it
     already communicated, the closing page at once ("<manager> will be in touch with other times"). A second No: a person will be in touch
     (after a reload too: the function's secondNo).
     No proposal yet: "We are choosing your times now; you will get an email within two days." ?setup is the rundown: each step with a Done
     button that posts setup_tick. A wave271 hire (mode grid) keeps the grid after Accept.
     wave275b (03/11/26, Steel: "Can we make the availability check for onboarding optional"), from the function's GET, never from app_config:
     hoursRequired false (onboard_require_hours off): the hours line is an optional box, Accept is enabled without it, and hours_ok is sent as ticked
     or not. managerHours false (onboard_manager_hours off): the manager's page has no "Set your week" gate, shows a saved week read-only for
     information, and lets any cell in the window start a meeting outside hub@ meetings, other hires and the lead time; the hire's No grid legend says
     the greys are the manager's hub@ meetings. Either field missing (a function from before wave275b): today's rule. -->
<style>
  :root { --green: #103F39; --cream: #FFFAF2; --ink: #1d1d1b; --muted: #6b6a66; --soft: #E6F0EA; --line: #cdd9d2; --flag: #B3402F; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; line-height: 1.5; }
  .top { background: var(--green); color: var(--cream); padding: 22px 20px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .02em; }
  .card { max-width: 560px; margin: 28px auto; padding: 0 20px 48px; }
  .card.wide { max-width: 1240px; }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.08; margin: 0 0 14px; color: var(--green); overflow-wrap: anywhere; }
  h1:focus { outline: none; }
  p { margin: 0 0 14px; font-size: 17px; overflow-wrap: anywhere; }
  .btn { display: block; width: 100%; text-align: center; background: var(--green); color: var(--cream); border: 0; border-radius: 999px; padding: 17px 20px; font: 600 18px 'Space Grotesk', sans-serif; cursor: pointer; margin: 24px 0 14px; }
  .btn:hover, .btn:focus-visible { background: #0b2f2b; }
  .btn[disabled] { opacity: .6; cursor: default; }
  .btn.pre { box-shadow: 0 0 0 4px var(--cream), 0 0 0 7px var(--green); }
  .quiet { display: block; width: 100%; text-align: center; background: none; border: 0; color: var(--muted); font: 15px 'Space Grotesk', sans-serif; text-decoration: underline; cursor: pointer; padding: 10px 8px; border-radius: 999px; }
  .quiet[disabled] { opacity: .6; cursor: default; }
  .quiet.pre { background: var(--soft); color: var(--ink); box-shadow: 0 0 0 3px var(--green); }
  .ok { background: var(--soft); border-radius: 16px; padding: 18px 20px; margin: 10px 0 14px; }
  .ok p:last-child { margin-bottom: 0; }
  .hint { background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: 15px; margin: 0 0 6px; }
  .lang { float: right; font-size: 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 500; }
  .lang a { color: var(--cream); text-decoration: none; opacity: .85; }
  .lang a:hover { opacity: 1; text-decoration: underline; }
  small, .small { color: var(--muted); font-size: 14px; }
  .hide { display: none !important; }
  .err { color: var(--flag); font-weight: 500; font-size: 15px; margin: 8px 0 0; }
  .note { font-size: 15px; color: var(--muted); }

  /* the availability grid: a column for every day on a computer, one day at a time (with day chips) on a phone */
  .chips { display: none; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .chip { position: relative; flex: 0 0 auto; min-width: 58px; padding: 6px 8px 5px; text-align: center; background: var(--cream); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; font: 500 13px/1.2 'Space Grotesk', sans-serif; cursor: pointer; }
  .chip b { display: block; font-size: 17px; font-weight: 600; }
  .chip i { position: absolute; top: -7px; right: -5px; min-width: 20px; padding: 0 5px; border-radius: 999px; background: var(--green); color: var(--cream); font: 600 12px/20px 'Space Grotesk', sans-serif; font-style: normal; }
  .chip.on { background: var(--green); color: var(--cream); border-color: var(--green); }
  .chip.on i { background: var(--cream); color: var(--green); }
  .grid { display: flex; gap: 3px; margin: 10px 0 0; user-select: none; -webkit-user-select: none; }
  .tcol { flex: 0 0 66px; }
  .day { flex: 1 1 0; min-width: 0; }
  .dh { height: 48px; display: flex; flex-direction: column; justify-content: center; text-align: center; font-size: 12px; line-height: 1.15; }
  .dh b { font-weight: 600; }
  .dh small { font-size: 10.5px; }
  .tl { height: 30px; line-height: 28px; font-size: 11px; color: var(--muted); text-align: right; padding-right: 6px; white-space: nowrap; }
  .cell { display: block; width: 100%; height: 28px; margin: 0 0 2px; padding: 0; background: var(--cream); border: 1px solid var(--line); border-radius: 5px; color: var(--ink); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; font: 500 15px 'Space Grotesk', sans-serif; }
  .cell .t { display: none; }
  .cell:hover { background: var(--soft); }
  .cell[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--cream); }
  .cell.off, .cell.off:hover { background: repeating-linear-gradient(135deg, #f1eee7, #f1eee7 4px, #e8e4da 4px, #e8e4da 8px); border-color: #e3dfd3; color: #a9a69d; cursor: not-allowed; }
  .cell:focus-visible, .chip:focus-visible, .btn:focus-visible, .quiet:focus-visible, .lang a:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .bar { position: sticky; bottom: 0; z-index: 2; background: var(--cream); border-top: 1px solid var(--line); margin: 14px -20px 0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .bar .count { flex: 1 1 160px; font-weight: 500; font-size: 16px; }
  .bar .btn { width: auto; flex: 0 0 auto; margin: 0; padding: 14px 28px; }
  .bar .quiet { width: auto; flex: 0 0 auto; }
  .need { flex: 1 1 100%; margin: 0; font-size: 15px; color: var(--muted); }
  .saved { background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: 15px; margin: 10px 0 0; flex: 1 1 100%; }
  /* wave275: the manager's availability editor and the two picks */
  .sec { max-width: 680px; }
  h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 27px; line-height: 1.1; margin: 34px 0 8px; color: var(--green); }
  h3 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px; margin: 22px 0 4px; color: var(--green); }
  .stale { background: #FCEFDD; border: 1px solid #E9C995; border-radius: 12px; padding: 12px 16px; font-size: 16px; font-weight: 500; margin: 4px 0 14px; }
  .wd { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 10px 0; border-top: 1px solid var(--line); }
  .wd:last-child { border-bottom: 1px solid var(--line); }
  .wdn { flex: 0 0 116px; font-weight: 600; padding-top: 8px; }
  .blocks { flex: 1 1 320px; min-width: 0; }
  .blk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 6px; }
  .blk input, .exd input { font: 500 16px 'Space Grotesk', sans-serif; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0; }
  .blk input { width: 8.4em; }
  .link { background: none; border: 0; padding: 6px 4px; color: var(--green); font: 500 15px 'Space Grotesk', sans-serif; text-decoration: underline; cursor: pointer; border-radius: 6px; }
  .link.rm { color: var(--muted); }
  .none { display: inline-block; color: var(--muted); font-size: 15px; padding: 7px 10px 7px 0; }
  .wk { display: inline-block; font-size: 16px; font-weight: 500; padding: 7px 14px 7px 0; }   /* amended 02/11/26: the usual week, read-only */
  .stale a { color: var(--green); font-weight: 600; }
  .ex { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin: 8px 0; }
  .exd { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; margin: 0 0 8px; }
  .btn.inline { display: inline-block; width: auto; padding: 14px 28px; margin: 18px 0 6px; }
  #avnote.need, #avnote.saved { margin: 4px 0 0; }
  .picks { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 8px; }
  .pick { flex: 1 1 250px; text-align: left; background: #fff; color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; font: 500 15px 'Space Grotesk', sans-serif; cursor: pointer; }
  .pick b { display: block; font-weight: 600; font-size: 16px; }
  .pick span { color: var(--muted); }
  .pick[aria-pressed="true"] { border-color: var(--green); background: var(--soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); margin: 6px 0 0; }
  .sw { display: inline-block; width: 16px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; border: 1px solid var(--line); }
  .sw-free { background: var(--cream); }
  .sw-call, .cell.pk-call, .cell.pk-call:hover { background: var(--green); border-color: var(--green); color: var(--cream); }
  .sw-one, .cell.pk-one, .cell.pk-one:hover { background: #3E8C7A; border-color: #3E8C7A; color: #fff; }
  .sw-busy, .cell.busy, .cell.busy:hover { background: repeating-linear-gradient(45deg, #efd9d2, #efd9d2 4px, #e4c6bc 4px, #e4c6bc 8px); border-color: #dcbcb1; color: #9a6a5e; }
  .sw-off { background: repeating-linear-gradient(135deg, #f1eee7, #f1eee7 4px, #e8e4da 4px, #e8e4da 8px); }
  .sw-mbusy, .cell.mbusy, .cell.mbusy:hover { background: #e4e1d8; border-color: #d6d2c6; color: #8f8c84; cursor: not-allowed; }
  .cell[disabled] { cursor: not-allowed; }
  .cell .k { font-size: 11px; font-weight: 600; }
  .pgrid .cell { position: relative; }
  .pick:focus-visible, .link:focus-visible, .blk input:focus-visible, .exd input:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  /* wave275 Task 3: the hours line, the two times, the closing page and the setup rundown */
  .hours { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 18px 0 0; font-size: 17px; line-height: 1.4; cursor: pointer; }
  .hours input { width: 22px; height: 22px; margin: 1px 0 0; flex: 0 0 auto; accent-color: var(--green); cursor: pointer; }
  .hours.on { border-color: var(--green); background: var(--soft); }
  #hoursneed { margin: 8px 0 0; }
  .times p { margin: 0 0 8px; }
  .times p:last-child { margin: 0; }
  a.btn { text-decoration: none; }
  .rundown { list-style: none; counter-reset: step; padding: 0; margin: 14px 0 18px; }
  .rstep { counter-increment: step; display: flex; gap: 14px; align-items: flex-start; border-top: 1px solid var(--line); padding: 14px 0; }
  .rstep:last-child { border-bottom: 1px solid var(--line); }
  .rtext { flex: 1 1 auto; min-width: 0; }
  .rstep h3 { margin: 0 0 4px; }
  .rstep h3::before { content: counter(step) '. '; }
  .rstep p { margin: 0; font-size: 16px; }
  .tick { flex: 0 0 auto; background: #fff; color: var(--green); border: 2px solid var(--green); border-radius: 999px; padding: 8px 16px; font: 600 15px 'Space Grotesk', sans-serif; cursor: pointer; }
  .tick[aria-pressed="true"] { background: var(--green); color: var(--cream); }
  .tick[aria-pressed="true"]::before { content: '\2713\00a0'; }
  .tick[disabled] { opacity: .6; cursor: default; }
  .tick:focus-visible, .hours input:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  p.count { font-weight: 500; margin: 0; }
  @media (max-width: 759px) {
    .card { margin-top: 20px; }
    h1 { font-size: 32px; }
    .chips { display: flex; }
    .tcol { display: none; }
    .grid { display: block; }
    .day { display: none; }
    .day.on { display: block; }
    .dh { height: auto; padding: 4px 0 10px; text-align: left; font-size: 16px; }
    .dh small { font-size: 14px; }
    .cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .cell { height: 46px; margin: 0; border-radius: 10px; }
    .cell .t { display: inline; }
    .bar .btn { flex: 1 1 auto; }
    .wdn { flex: 1 1 100%; padding-top: 0; }
    .blocks { flex: 1 1 100%; }
    .blk { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 6px; }
    .blk input { width: 100%; font-size: 15px; padding: 7px 6px; }
    .pgrid .cell .k { display: block; font-size: 10px; line-height: 1; }
    .rstep { flex-wrap: wrap; }
    .tick { margin-left: auto; }
  }
</style>
</head>

        else S.view = 'oops';
      }, function () { S.view = 'oops'; })
      .then(function () { S.busy = false; render(focusHeading); });
  }

  paintLang();
  if (!token) { S.view = 'bad'; render(false); return; }
  load('initial');
})();
</script>
