<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Give to Welfare Avenue</title>
<meta name="description" content="Give to Welfare Avenue, once or every month.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Welfare Avenue: the Hub's donation page (wave161, 28/09/26). Served at /give (and /give/thanks after Stripe) by a
     Netlify rewrite (_redirects). Reads its settings from the donate function, sends the donor to Stripe Checkout, and
     shows the thank-you from what Stripe says. Off until an admin puts it live in the Hub (CRM, Gifts, Online giving);
     ?preview=1 shows it to the team while it is off. Built by build/give/make.py from build/give/src.html.
     v2 (28/09/26, wave161b): when the function says pay 'embedded' (the publishable key is set), Stripe's own form opens
     inside this page (Embedded Checkout, Stripe.js v3 from js.stripe.com) and the donor never leaves the site; Change goes
     back to the choices. If Stripe.js cannot load, the page falls back to Stripe's hosted page as before.
     v3 (28/09/26, wave161c): inside the popup on welfareavenue.com (give/embed.js), or with ?embed=1, the page takes the
     embed layout: a photo beside the form, no green band or page footer (a short footer sits in the card), and it tells
     the popup its height and whether a payment is open; the thank-you has Close; Stripe's own page (the fallback) opens
     at the top of the window through a link, since Stripe's page cannot be shown inside a frame. -->
<style>
:root{--green:#103F39;--cream:#FFFAF2;--gold:#DCA527;--ink:#1F201E;--muted:#6B6A66;--line:rgba(16,63,57,.16);--flag:#B3402F;--card:#FFFFFF;--soft:rgba(16,63,57,.05)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.5}
.band{background:var(--green);color:var(--cream);padding:22px 16px 64px}
.band .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.lockup{height:58px;width:auto;display:block;color:var(--cream)}
main{max-width:640px;margin:-44px auto 0;padding:0 16px 40px}
.card{background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(16,63,57,.06),0 12px 32px rgba(16,63,57,.08);padding:28px 22px}
@media (min-width:640px){.card{padding:36px 40px}}
h1{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:34px;line-height:1.05;letter-spacing:.2px;text-transform:uppercase;color:var(--green);margin:0 0 6px}
.rule{width:56px;height:4px;border-radius:4px;background:var(--gold);margin:10px 0 14px}
.intro{margin:0 0 22px;color:#3d3c39;white-space:pre-line}
fieldset{border:0;padding:0;margin:0 0 22px;min-width:0}
legend,.lbl{display:block;font-weight:600;margin:0 0 8px;padding:0}
.freq{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--green);border-radius:999px;padding:3px;background:#fff}
.freq button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 12px;background:transparent;color:var(--green);cursor:pointer;min-width:0;margin:0}
.freq button[aria-checked="true"]{background:var(--green);color:var(--cream)}
.freq button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.amts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.amts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.amt{font:inherit;font-weight:600;font-size:18px;border:1.5px solid var(--line);border-radius:14px;padding:14px 8px;background:#fff;color:var(--ink);cursor:pointer;margin:0;min-width:0}
.amt:hover{border-color:rgba(16,63,57,.45)}
.amt[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:var(--cream)}
.amt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.amt small{display:block;font-weight:400;font-size:12px;opacity:.8}
.other{display:flex;align-items:center;gap:8px;margin-top:10px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:#fff}
.other:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(220,165,39,.35)}
.other span{font-weight:600;color:var(--muted)}
.other input{flex:1;min-width:0;font:inherit;font-size:18px;border:0;outline:0;padding:12px 0;background:transparent;color:inherit}
.other.on{border-color:var(--green)}
select,input[type=text]{width:100%;font:inherit;color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
select:focus,input[type=text]:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(220,165,39,.35)}
.check{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff;margin:0 0 10px}
.check input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--green);flex:none}
.check:has(input:checked){border-color:var(--green);background:var(--soft)}
.check:has(input:focus-visible){box-shadow:0 0 0 3px rgba(220,165,39,.45)}
.check.dashed{border-style:dashed}
.sub{margin:6px 0 12px 30px;display:grid;gap:8px}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:#fff}
.radios label:has(input:checked){border-color:var(--green);background:var(--soft)}
.radios input{accent-color:var(--green);margin:0}
.err{color:var(--flag);font-size:14px;margin:6px 0 0}
.bad .other,.bad input[type=text]{border-color:var(--flag)}
.small{font-size:13px;color:var(--muted);margin:6px 0 0}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:6px;padding-top:16px}
.total b{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:30px;color:var(--green);letter-spacing:.2px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.go{font:inherit;font-weight:600;font-size:17px;border:0;border-radius:999px;padding:14px 28px;background:var(--gold);color:var(--ink);cursor:pointer;margin-top:14px;width:100%}
.go:hover{filter:brightness(1.04)}
.go:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.go[disabled]{opacity:.65;cursor:progress}
.secure{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:var(--muted);margin:10px 0 0;text-align:center}
.secure svg{flex:none}
.banner{border-radius:12px;padding:12px 14px;margin:0 0 18px;font-size:15px}
.banner.warn{background:rgba(179,64,47,.08);color:#7e2b1f}
.banner.info{background:rgba(220,165,39,.18)}
.done p{white-space:pre-line}
.big{font-size:18px}
.loading{color:var(--muted)}
.summary{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 16px;background:var(--soft)}
.summary .what{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:26px;line-height:1.1;color:var(--green);letter-spacing:.2px}
.summary .small{margin:2px 0 0}
.linkbtn{font:inherit;font-weight:600;border:0;background:transparent;color:var(--green);text-decoration:underline;cursor:pointer;padding:4px 2px;margin:0;flex:none}
.linkbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.paybox{min-height:360px}
@media (max-width:519px){.paybox{margin:0 -14px}}
footer{max-width:640px;margin:0 auto;padding:0 16px 40px;font-size:13px;color:var(--muted)}
.ephoto{display:none}
.efoot{display:none}
html.embed,html.embed body{background:#fff}
html.embed .band,html.embed footer{display:none}
html.embed main{max-width:none;margin:0;padding:0}
html.embed .card{border-radius:0;box-shadow:none;padding:30px 22px 24px}
html.embed h1{padding-right:44px}
html.embed .efoot{display:block;font-size:12px;color:var(--muted);margin:18px 0 0;text-align:center}
html.embed .efoot a{color:inherit}
@media (min-width:760px){
  html.embed .ewrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:stretch}
  html.embed .ephoto{display:block;background-color:var(--green);background-size:cover;background-repeat:no-repeat;background-position:50% 42%;position:sticky;top:0;height:100vh;align-self:start}
  html.embed .card{padding:40px 40px 28px}
}
a{color:var(--green)}
.band .langlink{color:var(--cream);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
