<title>Welfare Avenue</title>
<meta name="description" content="Welfare Avenue: youth-powered meals and community in Montreal and Toronto. Volunteer, give, and follow along.">

<!-- Welfare Avenue: the link pages (wave230, 09/10/26; first page wave225). hub.welfareavenue.com/links is the bio page
     (slug main); /links/<slug> is any other page the marketing team makes in the Content Studio (Link pages). The page asks
     the linkpage function (Netlify proxies /lp) for its live blocks and a signed visit token; every button goes through
     /l/ (the go function), which counts the click with the page, the button, the source (?s=, the app it opened in, or the
     referring site), the A/B variant and the device, then redirects. No cookie, no local storage, no address kept: the
     network is reduced to keyed hashes on the server. ?preview=1 (inside the Studio) draws what the Studio sends by
     postMessage and records nothing. Built by build/links/make.py from build/links/src.html. -->
<style>
:root{--green:#103F39;--cream:#FFFAF2;--gold:#DCA527;--purple:#6F64AB;--ink:#1F201E}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;--bg:#103F39;--fg:#FFFAF2;--btn:#FFFAF2;--btnfg:#103F39;--accent:#DCA527;--card:rgba(255,250,242,.08);--line:rgba(255,250,242,.18);--r:999px;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:40px 18px calc(32px + env(safe-area-inset-bottom));text-align:center;position:relative}
.top{position:absolute;right:16px;top:14px;display:flex;gap:6px}
.top a{color:var(--fg);opacity:.75;font-size:12px;font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.top a.on{opacity:1;background:var(--card)}
.av{width:92px;height:92px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 14px;border:3px solid var(--accent)}
.lockup{width:170px;height:auto;color:var(--fg);margin:6px auto 18px;display:block}
h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:34px;letter-spacing:.4px;margin:0 0 6px;line-height:1.05}
p.bio{margin:0 auto 24px;font-size:15px;line-height:1.5;opacity:.9;max-width:420px}
.blocks{display:flex;flex-direction:column;gap:12px}
a.b{display:flex;align-items:center;gap:12px;background:var(--btn);color:var(--btnfg);text-decoration:none;font-weight:700;font-size:15.5px;border-radius:var(--r);padding:14px 18px;min-height:54px;text-align:left;position:relative;transition:transform .14s ease, box-shadow .14s ease;box-shadow:0 2px 0 rgba(0,0,0,.12)}
a.b:hover,a.b:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18);outline:none}
a.b:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
a.b .ic{font-size:20px;width:28px;text-align:center;flex:none}
a.b img.th{width:40px;height:40px;object-fit:cover;flex:none;border-radius:10px}
a.b .tx{flex:1;min-width:0;text-align:center}
a.b .tx small{display:block;font-weight:500;font-size:12.5px;opacity:.75;margin-top:2px}
a.b.has-ic .tx{text-align:left}
a.b .go{opacity:.5;font-size:14px}
a.b.feat{background:var(--accent);color:var(--green);box-shadow:0 0 0 0 rgba(220,165,39,.6);animation:pulse 2.6s ease-out infinite}
a.b.feat::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:2px solid var(--accent);opacity:.5}
a.b.donate{background:var(--gold);color:var(--green)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,165,39,.55)}70%{box-shadow:0 0 0 14px rgba(220,165,39,0)}100%{box-shadow:0 0 0 0 rgba(220,165,39,0)}}
@media (prefers-reduced-motion:reduce){a.b.feat{animation:none}a.b{transition:none}.num{transition:none}}
h2.hd{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:20px;letter-spacing:1px;text-transform:uppercase;margin:14px 0 0;opacity:.85}
p.tx{font-size:14px;line-height:1.55;margin:0;opacity:.9;white-space:pre-wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.card h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:2px 0 10px;opacity:.8;font-weight:700}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ig a{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.ig img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.ig a:hover img{transform:scale(1.05)}
.yt{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;cursor:pointer;border:0;padding:0;width:100%;display:block}
.yt img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.yt span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.yt span i{width:64px;height:44px;border-radius:12px;background:#FF0000;display:flex;align-items:center;justify-content:center}
.yt span i::after{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.yt iframe{width:100%;height:100%;border:0;display:block}
.ev{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;padding:8px;border-radius:12px;text-align:left}
.ev:hover{background:var(--line)}
.ev .d{width:48px;height:48px;border-radius:12px;background:var(--accent);color:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;flex:none;line-height:1}
.ev .d b{font-size:18px;font-family:'Barlow Condensed',sans-serif}.ev .d small{font-size:10px;text-transform:uppercase}
.ev span{display:block;font-size:14px;font-weight:700}.ev small.w{font-size:12px;opacity:.75}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px}
.num{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;color:var(--accent);display:block;line-height:1}
.stats small{font-size:12px;opacity:.85}
.soc{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin:2px 0 10px}
.soc a{width:42px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none;transition:color .15s,transform .15s}
.soc a svg{width:27px;height:27px;fill:currentColor}
.soc a:hover,.soc a:focus-visible{color:var(--accent);transform:translateY(-2px)}
.soc a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.soc a{transition:none}.soc a:hover{transform:none}}
.off{opacity:.45;outline:2px dashed var(--accent);outline-offset:3px;border-radius:var(--r)}
.tag{display:inline-block;font-size:10px;font-weight:700;background:var(--accent);color:var(--green);border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:middle}
footer{margin:30px 0 0;font-size:12px;opacity:.7;line-height:1.6}
footer a{color:inherit}
.load{opacity:.6;font-size:14px;padding:30px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
