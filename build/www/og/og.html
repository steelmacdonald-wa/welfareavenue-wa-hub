<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#103F39;font-family:'Space Grotesk',sans-serif}
.w{display:grid;grid-template-columns:600px 600px;height:630px}
.l{padding:64px 30px 56px 64px;display:flex;flex-direction:column;justify-content:space-between}
.l img{width:330px;height:auto}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;color:#FFFAF2;font-size:74px;line-height:.98;margin:0;letter-spacing:.5px}
h1 span{color:#DCA527}
.r{position:relative}
.r img{position:absolute;inset:40px 40px 40px 0;width:560px;height:550px;object-fit:cover;border-radius:8px}
</style></head><body><div class="w"><div class="l"><img src="/assets/lockup-cream.svg" alt=""><h1 id="h"></h1></div>
<div class="r"><img src="/img/2022-02-winter-volunteer-group-b-960.jpg" alt=""></div></div>
<script>var fr=location.hash==='#fr';document.getElementById('h').innerHTML=fr?'Aller à la rencontre<br><span>des gens, là où ils sont</span>':'We meet people<br><span>where they are</span>';</script>
</body></html>
